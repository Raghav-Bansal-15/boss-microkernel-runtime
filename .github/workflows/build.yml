name: Build

on:
  pull_request:
  push:
    branches: [main, fix/authenticated-runtime]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: runtime
      # Immutable companion host implementation from BossConsole #575.
      # Keep this until equivalent authenticated IPC artifacts are published.
      - uses: actions/checkout@v4
        with:
          repository: risa-labs-inc/BossConsole
          ref: d623754ff31a4666b3a86670f63cd5265d01b390
          path: host
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the companion host contract
        shell: bash
        working-directory: host
        run: ./gradlew assembleUpstreamJars --no-daemon
      - name: Build and test the packaged runtime
        shell: bash
        working-directory: runtime
        run: ./gradlew build fatJar -Pbossconsole.dir=../host --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-tests-${{ matrix.os }}
          path: runtime/build/test-results/
